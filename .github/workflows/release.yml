name: Release macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Version
        run: |
          echo "${{ github.ref_name }}" > assets/version.txt

      - name: Generate Icon
        run: |
          python make_icon.py assets/logo.svg unibrowse.iconset
          iconutil -c icns unibrowse.iconset -o assets/icon.icns

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --name "unibrowse" --windowed --add-data "assets:assets" --icon "assets/icon.icns" app.py

      - name: Create Artifact
        run: |
          cd dist
          zip -r unibrowse-macos.zip unibrowse.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/unibrowse-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
