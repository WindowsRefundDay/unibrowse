services:
  agent-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "9223:9223"
      - "37700-37800:37700-37800"
    volumes:
      - ./.profiles:/app/unibrowse/.profiles
      - ./.memories:/app/unibrowse/.memories
      - ./browser-harness/agent-workspace:/app/unibrowse/browser-harness/agent-workspace
    environment:
      - BH_NO_ACTIVATE=1
      - BU_NAME=remote-agent
    restart: unless-stopped
